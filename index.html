<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pharma Lead Generation Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<style>
  .trigger-critical { border-left: 6px solid #dc2626; }
  .trigger-warning { border-left: 6px solid #f59e0b; }
  .trigger-patent { border-left: 6px solid #8b5cf6; }
  .trigger-compliance { border-left: 6px solid #ef4444; }
  .trigger-investment { border-left: 6px solid #10b981; }
  .trigger-trial { border-left: 6px solid #3b82f6; }
  .loading-spinner { animation: spin 1s linear infinite; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  .fade-in { animation: fadeIn 0.5s ease-in; }
  @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
  .email-preview { max-height: 400px; overflow-y: auto; }
  .copy-success { animation: flash 0.5s ease-in-out; }
  @keyframes flash { 0%, 100% { background-color: #10b981; } 50% { background-color: #34d399; } }
  .source-validated { color: #10b981; }
  .source-unvalidated { color: #ef4444; }
  .linkedin-preview { max-height: 300px; overflow-y: auto; }
  .cta-button { transition: all 0.3s ease; }
  .cta-button:hover { transform: translateY(-2px); shadow: 0 4px 12px rgba(0,0,0,0.15); }
</style>
</head>
<body class="bg-gray-100 min-h-screen">

<!-- Header -->
<header class="bg-gradient-to-r from-blue-600 to-purple-600 text-white p-6 shadow-lg">
  <div class="container mx-auto">
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-3xl font-bold">Pharma Lead Generation Dashboard</h1>
        <p class="text-blue-100 mt-1">Real-time triggers for medical research platform outreach</p>
      </div>
      <div class="text-right">
        <div class="text-sm text-blue-100">Last Updated:</div>
        <div id="lastUpdate" class="text-lg font-semibold">Loading...</div>
      </div>
    </div>
  </div>
</header>

<!-- Stats Dashboard -->
<div class="container mx-auto p-6">
  <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
    <div class="bg-white rounded-lg shadow-md p-6 text-center">
      <div class="text-2xl font-bold text-red-600" id="criticalCount">0</div>
      <div class="text-gray-600">Critical Triggers</div>
    </div>
    <div class="bg-white rounded-lg shadow-md p-6 text-center">
      <div class="text-2xl font-bold text-orange-600" id="warningCount">0</div>
      <div class="text-gray-600">Warning Letters</div>
    </div>
    <div class="bg-white rounded-lg shadow-md p-6 text-center">
      <div class="text-2xl font-bold text-purple-600" id="patentCount">0</div>
      <div class="text-gray-600">Patent Issues</div>
    </div>
    <div class="bg-white rounded-lg shadow-md p-6 text-center">
      <div class="text-2xl font-bold text-green-600" id="investmentCount">0</div>
      <div class="text-gray-600">Investment Opportunities</div>
    </div>
  </div>

  <!-- Filter Controls -->
  <div class="bg-white rounded-lg shadow-md p-6 mb-6">
    <div class="flex flex-wrap gap-4 items-center">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Filter by Trigger:</label>
        <select id="triggerFilter" class="border rounded px-3 py-2">
          <option value="">All Triggers</option>
          <option value="warning-letter">Warning Letters (483s)</option>
          <option value="patent-expiry">Patent Expiry</option>
          <option value="compliance-issue">Compliance Issues</option>
          <option value="trial-difficulty">Trial Difficulties</option>
          <option value="investment-need">Investment Needs</option>
          <option value="regulatory-delay">Regulatory Delays</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Priority:</label>
        <select id="priorityFilter" class="border rounded px-3 py-2">
          <option value="">All Priority</option>
          <option value="critical">Critical</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
        </select>
      </div>
      <button onclick="refreshData()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
        <span id="refreshButton">Refresh Data</span>
      </button>
      <button onclick="exportLeads()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
        Export Leads
      </button>
    </div>
  </div>

  <!-- Loading Indicator -->
  <div id="loading" class="text-center py-8 hidden">
    <div class="loading-spinner inline-block w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full"></div>
    <p class="mt-2 text-gray-600">Scanning pharmaceutical news for triggers...</p>
  </div>

  <!-- Triggers List -->
  <div id="triggersContainer" class="space-y-4">
    <!-- Dynamic content will be inserted here -->
  </div>
</div>

<!-- Lead Details Modal -->
<div id="leadModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50">
  <div class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full max-h-90vh overflow-y-auto">
      <div class="p-6">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-xl font-bold">Lead Details</h3>
          <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
        <div id="modalContent">
          <!-- Modal content will be inserted here -->
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// Enhanced RSS feeds targeting regulatory and business triggers
const rssFeeds = {
  "FDA News": "https://api.rss2json.com/v1/api.json?rss_url=https://www.fda.gov/about-fda/contact-fda/stay-informed/rss-feeds/food-and-drug-administration/rss.xml",
  "FDA Warning Letters": "https://api.rss2json.com/v1/api.json?rss_url=https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/compliance-actions-and-activities/warning-letters",
  "Pharmaphorum": "https://api.rss2json.com/v1/api.json?rss_url=https://pharmaphorum.com/rssfeed/news",
  "Pharmaceutical Executive": "https://api.rss2json.com/v1/api.json?rss_url=https://www.pharmexec.com/rss",
  "FDA Law Blog": "https://api.rss2json.com/v1/api.json?rss_url=https://www.thefdalawblog.com/feed",
  "PharmTech News": "https://api.rss2json.com/v1/api.json?rss_url=https://www.pharmtech.com/rss",
  "FierceBiotech": "https://api.rss2json.com/v1/api.json?rss_url=https://www.fiercebiotech.com/rss/feed",
  "BioPharma Dive": "https://api.rss2json.com/v1/api.json?rss_url=https://www.biopharmadive.com/feeds/news/",
  "Regulatory Affairs Professionals": "https://api.rss2json.com/v1/api.json?rss_url=https://www.raps.org/news-and-articles/news-articles"
};

// Trigger keywords and their categories
const triggerKeywords = {
  'warning-letter': ['warning letter', '483', 'FDA inspection', 'compliance violation', 'regulatory action', 'enforcement', 'violation', 'non-compliance'],
  'patent-expiry': ['patent expiry', 'patent cliff', 'exclusivity', 'generic competition', 'patent challenge', 'intellectual property'],
  'compliance-issue': ['recall', 'safety issue', 'adverse event', 'regulatory issue', 'compliance failure', 'quality issue'],
  'trial-difficulty': ['trial failure', 'phase II', 'endpoint not met', 'enrollment challenge', 'trial delay', 'FDA hold'],
  'investment-need': ['funding', 'investment', 'capital raise', 'series', 'IPO', 'financial difficulty', 'cash runway'],
  'regulatory-delay': ['FDA delay', 'approval delay', 'regulatory setback', 'CRL', 'complete response letter']
};

let allTriggers = [];
let filteredTriggers = [];

// Initialize dashboard
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('lastUpdate').textContent = new Date().toLocaleString();
  refreshData();
  
  // Set up filter event listeners
  document.getElementById('triggerFilter').addEventListener('change', filterTriggers);
  document.getElementById('priorityFilter').addEventListener('change', filterTriggers);
});

async function refreshData() {
  const loading = document.getElementById('loading');
  const refreshButton = document.getElementById('refreshButton');
  
  loading.classList.remove('hidden');
  refreshButton.innerHTML = '<div class="loading-spinner inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full mr-2"></div>Refreshing...';
  
  allTriggers = [];
  
  try {
    const feedPromises = Object.entries(rssFeeds).map(async ([feedName, feedUrl]) => {
      try {
        const response = await fetch(feedUrl);
        const data = await response.json();
        
        if (data.items) {
          data.items.forEach(item => {
            const trigger = analyzeTrigger(item, feedName);
            if (trigger) {
              allTriggers.push(trigger);
            }
          });
        }
      } catch (error) {
        console.error(`Error fetching ${feedName}:`, error);
      }
    });
    
    await Promise.all(feedPromises);
    
    // Sort by priority and date
    allTriggers.sort((a, b) => {
      const priorityWeight = { critical: 3, high: 2, medium: 1 };
      return (priorityWeight[b.priority] || 0) - (priorityWeight[a.priority] || 0) || 
             new Date(b.date) - new Date(a.date);
    });
    
    filteredTriggers = [...allTriggers];
    updateStats();
    renderTriggers();
    
    document.getElementById('lastUpdate').textContent = new Date().toLocaleString();
    
  } finally {
    loading.classList.add('hidden');
    refreshButton.innerHTML = 'Refresh Data';
  }
}

function analyzeTrigger(item, source) {
  const title = item.title.toLowerCase();
  const description = (item.description || '').toLowerCase();
  const content = title + ' ' + description;
  
  let triggerType = null;
  let priority = 'medium';
  let company = extractCompanyName(item.title);
  
  // Analyze for trigger keywords
  for (const [type, keywords] of Object.entries(triggerKeywords)) {
    if (keywords.some(keyword => content.includes(keyword.toLowerCase()))) {
      triggerType = type;
      break;
    }
  }
  
  if (!triggerType) return null;
  
  // Determine priority based on content
  if (content.includes('warning letter') || content.includes('483') || content.includes('recall')) {
    priority = 'critical';
  } else if (content.includes('fda') || content.includes('compliance') || content.includes('failure')) {
    priority = 'high';
  }
  
  return {
    id: Math.random().toString(36).substr(2, 9),
    title: item.title,
    description: item.description || '',
    link: item.link,
    source: source,
    date: item.pubDate || new Date().toISOString(),
    triggerType: triggerType,
    priority: priority,
    company: company,
    actionable: generateActionableInsights(triggerType, company, item.title),
    contacts: generatePotentialContacts(company)
  };
}

function extractCompanyName(title) {
  // Simple company name extraction - can be enhanced with more sophisticated NLP
  const commonPharmaCompanies = [
    'Pfizer', 'Johnson & Johnson', 'Roche', 'Novartis', 'Merck', 'AbbVie', 'Sanofi',
    'GlaxoSmithKline', 'Gilead', 'Amgen', 'Bristol Myers Squibb', 'AstraZeneca',
    'Eli Lilly', 'Biogen', 'Regeneron', 'Vertex', 'Moderna', 'BioNTech'
  ];
  
  for (const company of commonPharmaCompanies) {
    if (title.toLowerCase().includes(company.toLowerCase())) {
      return company;
    }
  }
  
  // Try to extract company names from title patterns
  const companyPattern = /([A-Z][a-zA-Z]+(?: [A-Z][a-zA-Z]+)*(?:,? Inc\.?|,? Corp\.?|,? Ltd\.?|,? Pharmaceuticals?|,? Biotech)?)/g;
  const matches = title.match(companyPattern);
  
  return matches ? matches[0] : 'Unknown Company';
}

function generateActionableInsights(triggerType, company, title) {
  const insights = {
    'warning-letter': `${company} received FDA warning letter - compliance issues present. Opportunity to offer regulatory data management and compliance monitoring solutions.`,
    'patent-expiry': `${company} facing patent cliff challenges. Opportunity to provide competitive intelligence and market access data.`,
    'compliance-issue': `${company} experiencing compliance challenges. Opportunity to offer quality management and regulatory data solutions.`,
    'trial-difficulty': `${company} struggling with clinical trials. Opportunity to provide trial optimization and data analytics services.`,
    'investment-need': `${company} seeking funding. Opportunity to provide valuation data and competitive market analysis.`,
    'regulatory-delay': `${company} facing regulatory delays. Opportunity to offer regulatory intelligence and submission support data.`
  };
  
  return insights[triggerType] || `Opportunity to engage ${company} with relevant medical research platform solutions.`;
}

function generatePotentialContacts(company) {
  return [
    { role: 'Chief Medical Officer', email: `cmo@${company.toLowerCase().replace(/\s+/g, '')}.com` },
    { role: 'VP Regulatory Affairs', email: `regulatory@${company.toLowerCase().replace(/\s+/g, '')}.com` },
    { role: 'Head of Clinical Development', email: `clinical@${company.toLowerCase().replace(/\s+/g, '')}.com` },
    { role: 'Director of Market Access', email: `marketaccess@${company.toLowerCase().replace(/\s+/g, '')}.com` }
  ];
}

function updateStats() {
  const stats = {
    critical: allTriggers.filter(t => t.priority === 'critical').length,
    warning: allTriggers.filter(t => t.triggerType === 'warning-letter').length,
    patent: allTriggers.filter(t => t.triggerType === 'patent-expiry').length,
    investment: allTriggers.filter(t => t.triggerType === 'investment-need').length
  };
  
  document.getElementById('criticalCount').textContent = stats.critical;
  document.getElementById('warningCount').textContent = stats.warning;
  document.getElementById('patentCount').textContent = stats.patent;
  document.getElementById('investmentCount').textContent = stats.investment;
}

function renderTriggers() {
  const container = document.getElementById('triggersContainer');
  
  if (filteredTriggers.length === 0) {
    container.innerHTML = '<div class="text-center py-8 text-gray-500">No triggers found matching your filters.</div>';
    return;
  }
  
  container.innerHTML = filteredTriggers.map(trigger => `
    <div class="bg-white rounded-lg shadow-md p-6 trigger-${trigger.triggerType} fade-in cursor-pointer hover:shadow-lg transition-shadow"
         onclick="showLeadDetails('${trigger.id}')">
      <div class="flex justify-between items-start mb-4">
        <div class="flex-1">
          <div class="flex items-center gap-2 mb-2">
            <span class="px-2 py-1 text-xs rounded-full bg-${getPriorityColor(trigger.priority)}-100 text-${getPriorityColor(trigger.priority)}-800">
              ${trigger.priority.toUpperCase()}
            </span>
            <span class="px-2 py-1 text-xs rounded-full bg-blue-100 text-blue-800">
              ${getTriggerLabel(trigger.triggerType)}
            </span>
            <span class="text-sm text-gray-500">${new Date(trigger.date).toLocaleDateString()}</span>
          </div>
          <h3 class="text-lg font-semibold text-gray-900 mb-2">${trigger.title}</h3>
          <p class="text-gray-600 mb-3">${trigger.description.substring(0, 150)}...</p>
          <div class="text-sm font-medium text-blue-600">📊 ${trigger.company}</div>
        </div>
        <div class="ml-4 text-right">
          <div class="text-xs text-gray-500">Source:</div>
          <div class="text-sm font-medium">${trigger.source} ${getSourceValidation(trigger.source)}</div>
        </div>
      </div>
      <div class="bg-green-50 border border-green-200 rounded p-3 mb-4">
        <div class="text-sm font-medium text-green-800 mb-1">💡 Outreach Opportunity:</div>
        <div class="text-sm text-green-700">${trigger.actionable}</div>
      </div>
      <div class="flex gap-3 mt-4">
        <button onclick="openEmailModal('${trigger.id}')" class="cta-button flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-medium">
          📧 Generate Email
        </button>
        <button onclick="openLinkedInModal('${trigger.id}')" class="cta-button flex items-center gap-2 px-4 py-2 bg-blue-800 text-white rounded-lg hover:bg-blue-900 text-sm font-medium">
          💼 LinkedIn Post
        </button>
      </div>
    </div>
  `).join('');
}

function filterTriggers() {
  const triggerFilter = document.getElementById('triggerFilter').value;
  const priorityFilter = document.getElementById('priorityFilter').value;
  
  filteredTriggers = allTriggers.filter(trigger => {
    const matchesTrigger = !triggerFilter || trigger.triggerType === triggerFilter;
    const matchesPriority = !priorityFilter || trigger.priority === priorityFilter;
    return matchesTrigger && matchesPriority;
  });
  
  renderTriggers();
}

function showLeadDetails(triggerId) {
  const trigger = allTriggers.find(t => t.id === triggerId);
  if (!trigger) return;
  
  const modalContent = document.getElementById('modalContent');
  modalContent.innerHTML = `
    <div class="space-y-6">
      <div>
        <h4 class="text-lg font-semibold mb-2">Company: ${trigger.company}</h4>
        <p class="text-gray-600">${trigger.title}</p>
      </div>
      
      <div>
        <h5 class="font-semibold mb-2">Trigger Details:</h5>
        <div class="bg-gray-50 p-4 rounded">
          <p><strong>Type:</strong> ${getTriggerLabel(trigger.triggerType)}</p>
          <p><strong>Priority:</strong> ${trigger.priority.toUpperCase()}</p>
          <p><strong>Date:</strong> ${new Date(trigger.date).toLocaleDateString()}</p>
          <p><strong>Source:</strong> ${trigger.source}</p>
        </div>
      </div>
      
      <div>
        <h5 class="font-semibold mb-2">Outreach Strategy:</h5>
        <div class="bg-green-50 border border-green-200 p-4 rounded">
          <p>${trigger.actionable}</p>
        </div>
      </div>
      
      <div>
        <h5 class="font-semibold mb-2">Potential Contacts:</h5>
        <div class="space-y-2">
          ${trigger.contacts.map(contact => `
            <div class="bg-blue-50 border border-blue-200 p-3 rounded flex justify-between items-center">
              <div>
                <div class="font-medium">${contact.role}</div>
                <div class="text-sm text-gray-600">${contact.email}</div>
              </div>
              <button onclick="copyEmail('${contact.email}')" class="text-blue-600 hover:text-blue-800">
                📧 Copy
              </button>
            </div>
          `).join('')}
        </div>
      </div>
      
      <div>
        <h5 class="font-semibold mb-2">📧 Generated Email Copy:</h5>
        <div class="bg-blue-50 border border-blue-200 p-4 rounded email-preview">
          <div class="text-sm text-gray-700 whitespace-pre-line" id="emailContent-${trigger.id}">
            ${generatePersonalizedEmail(trigger)}
          </div>
        </div>
        <div class="mt-3 flex gap-2">
          <button onclick="copyEmailContent('${trigger.id}')" class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700 text-sm">
            📋 Copy Email
          </button>
          <button onclick="regenerateEmail('${trigger.id}')" class="bg-gray-600 text-white px-4 py-2 rounded hover:bg-gray-700 text-sm">
            🔄 Regenerate
          </button>
        </div>
      </div>
      
      <div class="flex gap-4 mt-6">
        <a href="${trigger.link}" target="_blank" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
          View Original Article
        </a>
        <button onclick="markAsContacted('${trigger.id}')" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
          Mark as Contacted
        </button>
      </div>
    </div>
  `;
  
  document.getElementById('leadModal').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('leadModal').classList.add('hidden');
}

function copyEmail(email) {
  navigator.clipboard.writeText(email);
  alert('Email copied to clipboard!');
}

function markAsContacted(triggerId) {
  const trigger = allTriggers.find(t => t.id === triggerId);
  if (trigger) {
    trigger.contacted = true;
    alert('Lead marked as contacted!');
    closeModal();
    renderTriggers();
  }
}

function exportLeads() {
  const csvContent = [
    ['Company', 'Trigger Type', 'Priority', 'Date', 'Title', 'Outreach Strategy', 'Contact Role', 'Contact Email', 'Email Subject', 'Generated Email Copy', 'Source URL'].join(','),
    ...filteredTriggers.map(trigger => {
      const emailContent = generatePersonalizedEmail(trigger);
      const emailLines = emailContent.split('\n');
      const subject = emailLines[0].replace('Subject: ', '');
      const emailBody = emailLines.slice(2).join('\n'); // Skip subject and empty line
      
      return trigger.contacts.map(contact => [
        `"${trigger.company}"`,
        `"${getTriggerLabel(trigger.triggerType)}"`,
        `"${trigger.priority}"`,
        `"${new Date(trigger.date).toLocaleDateString()}"`,
        `"${trigger.title.replace(/"/g, '""')}"`,
        `"${trigger.actionable.replace(/"/g, '""')}"`,
        `"${contact.role}"`,
        `"${contact.email}"`,
        `"${subject.replace(/"/g, '""')}"`,
        `"${emailBody.replace(/"/g, '""')}"`,
        `"${trigger.link}"`
      ].join(','));
    }).flat()
  ].join('\n');
  
  const blob = new Blob([csvContent], { type: 'text/csv' });
  const url = window.URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `pharma-leads-${new Date().toISOString().split('T')[0]}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  window.URL.revokeObjectURL(url);
}

function getPriorityColor(priority) {
  const colors = { critical: 'red', high: 'orange', medium: 'yellow' };
  return colors[priority] || 'gray';
}

function getTriggerLabel(triggerType) {
  const labels = {
    'warning-letter': 'Warning Letter/483',
    'patent-expiry': 'Patent Expiry',
    'compliance-issue': 'Compliance Issue',
    'trial-difficulty': 'Trial Difficulty',
    'investment-need': 'Investment Need',
    'regulatory-delay': 'Regulatory Delay'
  };
  return labels[triggerType] || triggerType;
}

      solution: 'specialized orphan drug development intelligence',
      benefit: 'maximize rare disease opportunities and expedited pathways',
      caseStudy: 'secured orphan designation for 25+ rare disease programs'
    },
    'merger-acquisition': {
      expertise: 'pharmaceutical M&A intelligence and due diligence',
      solution: 'comprehensive asset valuation and competitive positioning analysis',
      benefit: 'make informed strategic decisions with deep market insights',
      caseStudy: 'provided critical intelligence for $5B+ in pharmaceutical transactions'
    }
  }
};

function generatePersonalizedEmail(trigger) {
  const valueProps = SYNETICX_INFO.valueProps[trigger.triggerType] || SYNETICX_INFO.valueProps['compliance-issue'];
  
  // Extract specific details from the news story
  const storyDetails = extractStoryDetails(trigger);
  
  // Generate subject line
  const subject = generateSubjectLine(trigger, storyDetails);
  
  // Generate email body
  const emailBody = generateEmailBody(trigger, storyDetails, valueProps);
  
  return `Subject: ${subject}\n\n${emailBody}`;
}

function extractStoryDetails(trigger) {
  const title = trigger.title.toLowerCase();
  const description = trigger.description.toLowerCase();
  
  let details = {
    issue: '',
    severity: '',
    impact: '',
    timeframe: ''
  };
  
  // Extract specific issue details based on trigger type
  switch (trigger.triggerType) {
    case 'warning-letter':
      details.issue = extractWarningLetterDetails(title, description);
      details.severity = title.includes('serious') || title.includes('significant') ? 'serious' : 'standard';
      break;
    case 'patent-expiry':
      details.issue = extractPatentDetails(title, description);
      details.timeframe = extractTimeframe(title, description);
      break;
    case 'compliance-issue':
      details.issue = extractComplianceDetails(title, description);
      details.impact = extractImpactDetails(title, description);
      break;
    case 'trial-difficulty':
      details.issue = extractTrialDetails(title, description);
      details.severity = title.includes('failed') || title.includes('terminated') ? 'high' : 'medium';
      break;
    case 'investment-need':
      details.issue = extractInvestmentDetails(title, description);
      details.timeframe = extractTimeframe(title, description);
      break;
    case 'regulatory-delay':
      details.issue = extractRegulatoryDetails(title, description);
      details.timeframe = extractTimeframe(title, description);
      break;
  }
  
  return details;
}

function extractWarningLetterDetails(title, description) {
  if (title.includes('manufacturing')) return 'manufacturing violations';
  if (title.includes('clinical')) return 'clinical trial deficiencies';
  if (title.includes('quality')) return 'quality control issues';
  if (title.includes('data')) return 'data integrity concerns';
  if (title.includes('gmp') || title.includes('cgmp')) return 'cGMP compliance violations';
  return 'regulatory compliance deficiencies';
}

function extractPatentDetails(title, description) {
  if (title.includes('expir')) return 'patent expiration';
  if (title.includes('challenge')) return 'patent challenge';
  if (title.includes('litigation')) return 'patent litigation';
  if (title.includes('cliff')) return 'patent cliff';
  return 'intellectual property concerns';
}

function extractComplianceDetails(title, description) {
  if (title.includes('recall')) return 'product recall';
  if (title.includes('contamina')) return 'contamination issues';
  if (title.includes('adverse')) return 'adverse events';
  if (title.includes('safety')) return 'safety concerns';
  return 'compliance violations';
}

function extractTrialDetails(title, description) {
  if (title.includes('failed') || title.includes('miss')) return 'missed primary endpoints';
  if (title.includes('enrollment')) return 'enrollment challenges';
  if (title.includes('hold') || title.includes('suspend')) return 'regulatory hold';
  if (title.includes('delay')) return 'trial delays';
  return 'clinical development setbacks';
}

function extractInvestmentDetails(title, description) {
  if (title.includes('funding') || title.includes('capital')) return 'funding requirements';
  if (title.includes('ipo')) return 'IPO considerations';
  if (title.includes('cash')) return 'cash flow challenges';
  if (title.includes('investment')) return 'investment opportunities';
  return 'capital needs';
}

function extractRegulatoryDetails(title, description) {
  if (title.includes('crl') || title.includes('complete response')) return 'Complete Response Letter';
  if (title.includes('delay')) return 'regulatory approval delays';
  if (title.includes('pdufa')) return 'PDUFA date extension';
  if (title.includes('fda')) return 'FDA regulatory challenges';
  return 'regulatory setbacks';
}

function extractTimeframe(title, description) {
  const content = title + ' ' + description;
  if (content.includes('immediate') || content.includes('urgent')) return 'immediate';
  if (content.includes('this year') || content.includes('2024') || content.includes('2025')) return 'near-term';
  if (content.includes('next year') || content.includes('2026')) return 'medium-term';
  return 'ongoing';
}

function extractImpactDetails(title, description) {
  const content = title + ' ' + description;
  if (content.includes('million') || content.includes('significant') || content.includes('major')) return 'significant';
  if (content.includes('minor') || content.includes('limited')) return 'limited';
  return 'material';
}

function generateSubjectLine(trigger, storyDetails) {
  const subjects = {
    'warning-letter': `Strategic Support Following ${trigger.company}'s FDA Warning Letter`,
    'patent-expiry': `Competitive Intelligence Solutions for ${trigger.company}'s Patent Considerations`,
    'compliance-issue': `Regulatory Remediation Support for ${trigger.company}`,
    'trial-difficulty': `Clinical Development Solutions for ${trigger.company}`,
    'investment-need': `Due Diligence Intelligence for ${trigger.company}'s Growth Strategy`,
    'regulatory-delay': `Regulatory Strategy Support for ${trigger.company}'s Submission`,
    'orphan-drug': `Rare Disease Intelligence Solutions for ${trigger.company}`,
    'merger-acquisition': `Transaction Intelligence Support for ${trigger.company}`
  };
  
  return subjects[trigger.triggerType] || `Strategic Partnership Opportunity with ${trigger.company}`;
}

  const date = new Date().toLocaleDateString('en-US', {

  return `Dear [Contact Name],

I hope this message finds you well. I'm reaching out from ${SYNETICX_INFO.companyName}, a leading ${SYNETICX_INFO.tagline} founded by ${SYNETICX_INFO.coFounders.join(' and ')} that specializes in ${valueProps.expertise}.

I noticed the recent development regarding ${trigger.company}'s ${storyDetails.issue || 'situation'} as reported in ${trigger.source}. Having worked extensively with pharmaceutical companies facing similar challenges, our team understands the complexities and strategic considerations this presents for your organization.

}

function regenerateEmail(triggerId) {
  const trigger = allTriggers.find(t => t.id === triggerId);
  if (!trigger) return;
  
  // Add slight variation to regeneration
  trigger._emailVariation = (trigger._emailVariation || 0) + 1;
  
  const newEmail = generatePersonalizedEmail(trigger);
  const contentElement = document.getElementById(`emailContent-${triggerId}`);
  if (contentElement) {
    contentElement.textContent = newEmail;
    // Add flash effect
    contentElement.parentElement.style.animation = 'flash 0.5s ease-in-out';
    setTimeout(() => {
      contentElement.parentElement.style.animation = '';
    }, 500);
  }
}

function copyEmailContent(triggerId) {
  const contentElement = document.getElementById(`emailContent-${triggerId}`);
  if (contentElement) {
    const emailText = contentElement.textContent;
    
    // Copy to clipboard
    navigator.clipboard.writeText(emailText).then(() => {
      // Show success feedback
      const button = event.target;
      const originalText = button.innerHTML;
      button.innerHTML = '✅ Copied!';
      button.classList.add('copy-success');
      
      setTimeout(() => {
        button.innerHTML = originalText;
        button.classList.remove('copy-success');
      }, 2000);
    }).catch(err => {
      console.error('Failed to copy email:', err);
      alert('Failed to copy email. Please select and copy manually.');
    });
  }
}

// Auto-refresh every 30 minutes
setInterval(refreshData, 30 * 60 * 1000);
</script>
